[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homeguard"
version = "0.1.0"
description = "Defensive personal/home security self-audit: macOS baseline, LAN weak services, dependency vulnerabilities (OSV), with HTML/Markdown reports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "homeguard contributors" }]
keywords = ["security", "audit", "macos", "osv", "home-network", "defensive"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
homeguard = "homeguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Keep typing.List/Dict style for Python 3.9 runtime compatibility
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["homeguard"]
known-local-folder = ["conftest", "test_deps"]
